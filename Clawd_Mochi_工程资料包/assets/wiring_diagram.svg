<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#f7f7f7"/>
  <text x="600" y="50" text-anchor="middle" font-size="34" font-family="Arial" font-weight="bold">Clawd Mochi 接线示意图</text>
  <rect x="120" y="120" width="330" height="480" rx="20" fill="#ffffff" stroke="#111" stroke-width="3"/>
  <text x="285" y="160" text-anchor="middle" font-size="26" font-family="Arial" font-weight="bold">ESP32-C3 SuperMini</text>
  <rect x="750" y="120" width="330" height="480" rx="20" fill="#ffffff" stroke="#111" stroke-width="3"/>
  <text x="915" y="160" text-anchor="middle" font-size="26" font-family="Arial" font-weight="bold">ST7789 1.54 TFT</text>
  <g font-family="Arial" font-size="21">
    <text x="170" y="225">3V3</text><text x="1020" y="225">VCC</text>
    <text x="170" y="270">GND</text><text x="1020" y="270">GND</text>
    <text x="170" y="315">GPIO10</text><text x="985" y="315">SDA / MOSI</text>
    <text x="170" y="360">GPIO8</text><text x="995" y="360">SCL / SCK</text>
    <text x="170" y="405">GPIO2</text><text x="1000" y="405">RES / RST</text>
    <text x="170" y="450">GPIO1</text><text x="1040" y="450">DC</text>
    <text x="170" y="495">GPIO4</text><text x="1040" y="495">CS</text>
    <text x="170" y="540">GPIO3</text><text x="1015" y="540">BL / BLK</text>
  </g>
  <g stroke-width="5" fill="none">
    <line x1="430" y1="220" x2="750" y2="220" stroke="#e53935"/>
    <line x1="430" y1="265" x2="750" y2="265" stroke="#111111"/>
    <line x1="430" y1="310" x2="750" y2="310" stroke="#fb8c00"/>
    <line x1="430" y1="355" x2="750" y2="355" stroke="#43a047"/>
    <line x1="430" y1="400" x2="750" y2="400" stroke="#8e24aa"/>
    <line x1="430" y1="445" x2="750" y2="445" stroke="#1e88e5"/>
    <line x1="430" y1="490" x2="750" y2="490" stroke="#eeeeee"/>
    <line x1="430" y1="535" x2="750" y2="535" stroke="#fdd835"/>
  </g>
  <rect x="220" y="630" width="760" height="50" rx="10" fill="#fff3cd" stroke="#ff9800"/>
  <text x="600" y="663" text-anchor="middle" font-family="Arial" font-size="23" font-weight="bold">注意：VCC 接 3.3V，绝对不要接 5V</text>
</svg>
